<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head th:fragment="head(titulo)">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${titulo}">Gestão de Livros</title>
    <style>
        :root {
            --ink: #1a1a1a;
            --muted: #666666;
            --border: #d9d9d9;
            --accent: #1d4ed8;
            --accent-hover: #1e40af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background: #ffffff;
            color: var(--ink);
            font-family: system-ui, "Segoe UI", Arial, sans-serif;
            font-size: 17px;
            line-height: 1.6;
        }
        a { color: var(--accent); }

        /* Navegação simples */
        nav {
            border-bottom: 1px solid var(--border);
            padding: 1rem 1.5rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .marca { font-weight: 700; color: var(--ink); text-decoration: none; font-size: 1.1rem; }
        nav ul { display: flex; gap: 1.25rem; list-style: none; }
        nav a.link { color: var(--muted); text-decoration: none; }
        nav a.link:hover { color: var(--ink); text-decoration: underline; }

        main { max-width: 960px; margin: 0 auto; padding: 2rem 1.5rem 4rem; }

        h1 { font-size: 1.6rem; margin-bottom: .5rem; }
        h2 { font-size: 1.2rem; margin-bottom: 1rem; }
        .lead { color: var(--muted); margin-bottom: 1.5rem; }

        /* Botões */
        .btn {
            display: inline-block;
            background: var(--accent);
            color: #ffffff;
            border: 1px solid var(--accent);
            padding: .55rem 1.1rem;
            font: inherit;
            font-size: .95rem;
            cursor: pointer;
            text-decoration: none;
        }
        .btn:hover { background: var(--accent-hover); border-color: var(--accent-hover); }
        .btn-ghost {
            background: #ffffff;
            color: var(--ink);
            border: 1px solid var(--border);
        }
        .btn-ghost:hover { background: #f5f5f5; }
        .btn-danger-link {
            background: none;
            border: none;
            color: #b91c1c;
            text-decoration: underline;
            font: inherit;
            font-size: .95rem;
            cursor: pointer;
            padding: 0;
        }

        /* Avisos */
        .aviso {
            padding: .75rem 1rem;
            margin-bottom: 1rem;
            font-size: .95rem;
        }
        .aviso.ok { background: #ecfdf5; border: 1px solid #a7f3d0; color: #065f46; }
        .aviso.erro { background: #fef2f2; border: 1px solid #fca5a5; color: #991b1b; }

        /* Tabelas e fichas */
        table { width: 100%; border-collapse: collapse; }
        th, td { text-align: left; padding: .65rem .75rem; border-bottom: 1px solid var(--border); vertical-align: top; }
        th { font-weight: 600; color: var(--muted); font-size: .9rem; }
        td .titulo-livro { font-weight: 600; }
        td a { text-decoration: none; }
        td a:hover { text-decoration: underline; }

        /* Formulário */
        .cartao-form {
            border: 1px solid var(--border);
            padding: 2rem;
            max-width: 640px;
        }
        .campo { margin-bottom: 1.1rem; }
        .campo label { display: block; font-size: .9rem; font-weight: 600; margin-bottom: .3rem; }
        .campo input, .campo select {
            width: 100%;
            padding: .55rem .75rem;
            border: 1px solid var(--border);
            font: inherit;
            color: var(--ink);
            background: #ffffff;
        }
        .campo input:focus, .campo select:focus { outline: 2px solid var(--accent); outline-offset: 1px; border-color: var(--accent); }
        .duas-colunas { display: grid; grid-template-columns: 1fr 140px; gap: 1rem; }
        .erro-campo { color: #b91c1c; font-size: .85rem; margin-top: .25rem; }
        .acoes-form { display: flex; gap: .75rem; margin-top: 1.5rem; align-items: center; }

        /* Ficha de detalhe */
        dl.ficha { display: grid; grid-template-columns: 200px 1fr; gap: .5rem 1rem; margin: 1.5rem 0; }
        dl.ficha dt { color: var(--muted); font-size: .9rem; }
        dl.ficha dd { font-size: 1rem; }

        footer.page {
            border-top: 1px solid var(--border);
            padding: 1rem 1.5rem;
            font-size: .8rem;
            color: var(--muted);
        }
        footer.page a { color: var(--muted); }

        .vazio { color: var(--muted); font-style: italic; padding: 2rem 0; }
        .barra-topo { display: flex; justify-content: space-between; align-items: center; gap: 1rem; flex-wrap: wrap; margin-bottom: 1.5rem; }
    </style>
</head>
</html>
